# Local and single-host deployment.
#
# Not a production topology: one application instance, no load balancer, no
# replicas. It exists so the stack can be started reproducibly and so the
# container build is exercised regularly rather than only at release.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-compliance}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host by default: an exposed database port is the
    # most common way a development stack becomes an incident.
    expose:
      - "5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-compliance}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      EVIDENCE_FRESHNESS_DAYS: ${EVIDENCE_FRESHNESS_DAYS:-90}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_UPLOAD_ROWS: ${MAX_UPLOAD_ROWS:-100000}
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:-}
      ENCRYPTION_ACTIVE_KEY_ID: ${ENCRYPTION_ACTIVE_KEY_ID:-}
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://integrate.api.nvidia.com/v1}
      AI_MODEL: ${AI_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
    ports:
      - "8000:8000"
    volumes:
      # Evidence must outlive the container. Losing it would destroy the proof
      # behind every finding.
      - evidence_store:/app/evidence_store

volumes:
  postgres_data:
  evidence_store: