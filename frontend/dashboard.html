<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard - Compliance Engine</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
<div id="nav-placeholder"></div>
<main>
  <div class="page-head">
    <div>
      <h2 style="margin-bottom:4px">Dashboard</h2>
      <p class="page-sub">Compliance posture at a glance across your organization.</p>
    </div>
  </div>

  <div class="cards">
    <div class="card"><h3 id="scans">0</h3><p>Total Scans</p></div>
    <div class="card"><h3 id="violations">0</h3><p>Total Violations</p></div>
    <div class="card"><h3 id="anomalies">0</h3><p>Anomalies Detected</p></div>
  </div>

  <div class="dash-grid">
    <div class="panel chart-panel">
      <div class="panel-head">
        <h2>Severity Breakdown</h2>
        <span class="hint">click a slice to filter</span>
      </div>
      <canvas id="severityChart"></canvas>
    </div>

    <div class="panel findings-panel">
      <div class="panel-head">
        <h2>Recent Findings</h2>
        <span id="filter-indicator"></span>
      </div>
      <table>
        <thead><tr><th>Server</th><th>Rule</th><th>Severity</th><th>Anomaly</th><th>Time</th></tr></thead>
        <tbody id="findings-body"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="js/auth.js"></script>
<script>
requireAuth();
renderNav("dashboard.html");

let allRecentViolations = [];
let activeFilter = null;

function countUp(id, target) {
  const el = document.getElementById(id);
  let current = 0;
  const step = Math.max(1, Math.ceil(target / 30));
  const interval = setInterval(() => {
    current += step;
    if (current >= target) { current = target; clearInterval(interval); }
    el.innerText = current;
  }, 20);
}

function renderFindings() {
  const tbody = document.getElementById("findings-body");
  const list = activeFilter ? allRecentViolations.filter(v => v.severity === activeFilter) : allRecentViolations;

  const fi = document.getElementById("filter-indicator");
  fi.innerHTML = "";
  if (activeFilter) {
    const chip = document.createElement("span");
    chip.className = "filter-chip";
    chip.textContent = `Filtered: ${activeFilter} `;
    const btn = document.createElement("button");
    btn.textContent = "✕"; btn.onclick = clearFilter;
    chip.appendChild(btn);
    fi.appendChild(chip);
  }

  if (list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty-state">No findings match this filter.</td></tr>`;
    return;
  }
  tbody.innerHTML = "";
  list.forEach((v, i) => {
    const row = document.createElement("tr");
    row.className = "row-in";
    row.style.animationDelay = (i * 0.03) + "s";

    // server
    const srvTd = document.createElement("td"); srvTd.textContent = v.server_id; srvTd.style.fontWeight = "600";
    // rule
    const ruleTd = document.createElement("td"); ruleTd.textContent = v.rule_name;
    // severity pill
    const sevTd = document.createElement("td");
    const pill = document.createElement("span");
    pill.className = "pill " + (v.severity || "").toLowerCase();
    pill.textContent = v.severity;
    sevTd.appendChild(pill);
    // anomaly dot
    const anomTd = document.createElement("td");
    if (v.is_anomaly) { anomTd.innerHTML = '<span class="dot amber"></span>Yes'; }
    else { anomTd.textContent = "No"; anomTd.style.color = "var(--text-dim)"; }
    // time
    const timeTd = document.createElement("td");
    timeTd.textContent = new Date(v.created_at).toLocaleString();
    timeTd.className = "mono-cell";

    row.append(srvTd, ruleTd, sevTd, anomTd, timeTd);
    tbody.appendChild(row);
  });
}

function clearFilter() { activeFilter = null; renderFindings(); }

async function loadDashboard() {
  const res = await apiFetch("/dashboard/summary");
  const data = await res.json();

  countUp("scans", data.total_scans);
  countUp("violations", data.total_violations);
  countUp("anomalies", data.anomaly_count);

  allRecentViolations = data.recent_violations;
  renderFindings();

  new Chart(document.getElementById("severityChart"), {
    type: "doughnut",
    data: {
      labels: ["HIGH", "MEDIUM", "LOW"],
      datasets: [{
        data: [data.severity_breakdown.HIGH, data.severity_breakdown.MEDIUM, data.severity_breakdown.LOW],
        backgroundColor: ["#f0523f", "#f5a623", "#35c98a"],
        borderColor: "#16161a", borderWidth: 3
      }]
    },
    options: {
      plugins: { legend: { labels: { color: "#8a8a94", font: { size: 12 }, padding: 16 } } },
      cutout: "58%",
      onClick: (evt, elements) => {
        if (elements.length > 0) {
          activeFilter = ["HIGH", "MEDIUM", "LOW"][elements[0].index];
          renderFindings();
        }
      }
    }
  });
}
loadDashboard();
</script>
</body>
</html>
