<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rules - Compliance Engine</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav-placeholder"></div>
<main>
  <div class="page-head">
    <div>
      <h2 style="margin-bottom:4px">Compliance Rules</h2>
      <p class="page-sub">Detection logic mapped to compliance frameworks. Edits create a new version; history is preserved.</p>
    </div>
  </div>

  <div class="rules-layout">
    <!-- Rules table -->
    <div class="panel rules-table-panel">
      <div class="panel-head">
        <h2>Active Rules</h2>
        <span class="hint" id="rule-count"></span>
      </div>
      <input type="text" id="rule-search" placeholder="Search by name, framework, or severity..." oninput="filterRules()">
      <table>
        <thead><tr><th>Name</th><th>Ver</th><th>Framework</th><th>Severity</th><th>Active</th><th>Actions</th></tr></thead>
        <tbody id="rules-body"></tbody>
      </table>
    </div>

    <!-- Create / edit form -->
    <!-- AI control drafting -->
    <div class="panel ai-draft-panel">
      <div class="panel-head">
        <h2>Draft a Control with AI</h2>
        <span class="hint">NEMOR Analyst · proposes only, you approve</span>
      </div>
      <label class="field-label">Describe the requirement in plain English</label>
      <input type="text" id="ai-requirement" placeholder="e.g. Servers must not expose RDP without MFA enabled">
      <button onclick="draftControl()" id="draft-btn">Generate Draft</button>
      <p id="draft-status" class="status-line"></p>
      <div id="draft-result" style="display:none"></div>
    </div>
    <div class="panel rules-form-panel">
      <div class="panel-head">
        <h2 id="form-title">Create New Rule</h2>
        <span class="hint" id="form-mode">Admin only</span>
      </div>
      <label class="field-label">Rule name</label>
      <input type="text" id="r-name" placeholder="e.g. weak_password_policy">
      <label class="field-label">Description</label>
      <input type="text" id="r-description" placeholder="What this rule detects">
      <label class="field-label">Framework</label>
      <input type="text" id="r-framework" placeholder="e.g. ISO 27001">
      <label class="field-label">Severity</label>
      <select id="r-severity"><option value="HIGH">HIGH</option><option value="MEDIUM">MEDIUM</option><option value="LOW">LOW</option></select>
      <label class="field-label">Remediation</label>
      <input type="text" id="r-remediation" placeholder="How to fix it">

      <div class="condition-box">
        <label class="field-label">Condition</label>
        <div class="condition-row">
          <input type="text" id="r-field" placeholder="field (e.g. port)">
          <select id="r-operator" class="op-select"><option value="==">==</option><option value="!=">!=</option><option value=">">&gt;</option><option value="<">&lt;</option><option value=">=">&gt;=</option><option value="<=">&lt;=</option><option value="in">in</option></select>
          <input type="text" id="r-value" placeholder="value">
        </div>
      </div>

      <div class="form-actions">
        <button id="submit-btn" onclick="submitRule()">Create Rule</button>
        <button id="cancel-btn" onclick="cancelEdit()" style="display:none" class="action-btn">Cancel</button>
      </div>
      <p id="rule-status" class="status-line"></p>
    </div>
  </div>
</main>

<script src="js/auth.js"></script>
<script>
requireAuth();
renderNav("rules.html");
let allRules = [];
let editingId = null;

async function loadRules() {
  const res = await apiFetch("/rules");
  allRules = await res.json();
  renderRules(allRules);
}

function pill(text, cls) {
  const span = document.createElement("span");
  span.className = "pill " + cls;
  span.textContent = text;
  return span;
}

function renderRules(list) {
  const tbody = document.getElementById("rules-body");
  document.getElementById("rule-count").textContent = `${list.length} rule${list.length === 1 ? "" : "s"}`;
  if (list.length === 0) { tbody.innerHTML = `<tr><td colspan="6" class="empty-state">No matching rules.</td></tr>`; return; }
  tbody.innerHTML = "";
  list.forEach((r, i) => {
    const row = document.createElement("tr");
    row.className = "row-in";
    row.style.animationDelay = (i * 0.03) + "s";

    const nameTd = document.createElement("td");
    nameTd.textContent = r.name; nameTd.style.fontWeight = "600";

    const verTd = document.createElement("td");
    const vBadge = document.createElement("span");
    vBadge.className = "ver-badge"; vBadge.textContent = "v" + (r.version || 1);
    verTd.appendChild(vBadge);

    const fwTd = document.createElement("td"); fwTd.textContent = r.framework; fwTd.className = "mono-cell";

    const sevTd = document.createElement("td");
    sevTd.appendChild(pill(r.severity, r.severity.toLowerCase()));

    const activeTd = document.createElement("td");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = !!r.active;
    cb.onchange = () => toggleRule(r.id, cb.checked);
    activeTd.appendChild(cb);

    const actionsTd = document.createElement("td");
    const editBtn = document.createElement("button");
    editBtn.className = "action-btn"; editBtn.textContent = "Edit";
    editBtn.style.marginRight = "6px";
    editBtn.onclick = () => startEdit(r.id);
    const delBtn = document.createElement("button");
    delBtn.className = "action-btn danger"; delBtn.textContent = "Delete";
    delBtn.onclick = () => deleteRule(r.id);
    actionsTd.appendChild(editBtn); actionsTd.appendChild(delBtn);

    row.append(nameTd, verTd, fwTd, sevTd, activeTd, actionsTd);
    tbody.appendChild(row);
  });
}

function filterRules() {
  const q = document.getElementById("rule-search").value.toLowerCase();
  renderRules(allRules.filter(r => r.name.toLowerCase().includes(q) || (r.framework||"").toLowerCase().includes(q) || r.severity.toLowerCase().includes(q)));
}

async function toggleRule(id, isActive) {
  await apiFetch(`/rules/${id}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ active: isActive }) });
  loadRules();
}

async function deleteRule(id) {
  if (!confirm("Delete this rule? This cannot be undone.")) return;
  await apiFetch(`/rules/${id}`, { method: "DELETE" });
  if (editingId === id) cancelEdit();
  loadRules();
}

function parseValue(raw) { try { return JSON.parse(raw); } catch { return raw; } }
function valueToText(v) { return typeof v === "string" ? v : JSON.stringify(v); }

function startEdit(id) {
  const rule = allRules.find(r => r.id === id);
  if (!rule) return;
  editingId = id;
  document.getElementById("form-title").innerText = `Edit: ${rule.name}`;
  document.getElementById("form-mode").innerText = `creating v${(rule.version || 1) + 1}`;
  document.getElementById("r-name").value = rule.name;
  document.getElementById("r-name").disabled = true;
  document.getElementById("r-description").value = rule.description || "";
  document.getElementById("r-framework").value = rule.framework || "";
  document.getElementById("r-severity").value = rule.severity || "HIGH";
  document.getElementById("r-remediation").value = rule.remediation || "";

  let cond = { field: "", operator: "==", value: "" };
  try { const parsed = JSON.parse(rule.condition); if (Array.isArray(parsed) && parsed.length) cond = parsed[0]; } catch {}
  document.getElementById("r-field").value = cond.field || "";
  document.getElementById("r-operator").value = cond.operator || "==";
  document.getElementById("r-value").value = valueToText(cond.value);

  document.getElementById("submit-btn").innerText = "Save Changes";
  document.getElementById("cancel-btn").style.display = "inline-block";
  document.getElementById("rule-status").innerText = "";
  document.querySelector(".rules-form-panel").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function cancelEdit() {
  editingId = null;
  document.getElementById("form-title").innerText = "Create New Rule";
  document.getElementById("form-mode").innerText = "Admin only";
  document.getElementById("r-name").disabled = false;
  ["r-name","r-description","r-framework","r-remediation","r-field","r-value"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("r-severity").value = "HIGH";
  document.getElementById("r-operator").value = "==";
  document.getElementById("submit-btn").innerText = "Create Rule";
  document.getElementById("cancel-btn").style.display = "none";
  document.getElementById("rule-status").innerText = "";
}

async function submitRule() {
  const status = document.getElementById("rule-status");
  const condition = [{
    field: document.getElementById("r-field").value,
    operator: document.getElementById("r-operator").value,
    value: parseValue(document.getElementById("r-value").value)
  }];

  if (editingId === null) {
    const payload = {
      name: document.getElementById("r-name").value,
      description: document.getElementById("r-description").value,
      framework: document.getElementById("r-framework").value,
      severity: document.getElementById("r-severity").value,
      remediation: document.getElementById("r-remediation").value,
      condition, active: true
    };
    const res = await apiFetch("/rules", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    if (res.ok) { status.className = "status-line ok"; status.innerText = "Rule created."; cancelEdit(); loadRules(); }
    else if (res.status === 403) { status.className = "status-line err"; status.innerText = "Not authorized — only Admins can create rules."; }
    else { status.className = "status-line err"; status.innerText = "Failed to create rule."; }
  } else {
    const payload = {
      description: document.getElementById("r-description").value,
      framework: document.getElementById("r-framework").value,
      severity: document.getElementById("r-severity").value,
      remediation: document.getElementById("r-remediation").value,
      condition
    };
    const res = await apiFetch(`/rules/${editingId}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    if (res.ok) { status.className = "status-line ok"; status.innerText = "Rule updated — new version created."; cancelEdit(); loadRules(); }
    else if (res.status === 403) { status.className = "status-line err"; status.innerText = "Not authorized to edit rules."; }
    else { status.className = "status-line err"; status.innerText = "Failed to update rule."; }
  }
}
let currentDraft = null;

async function draftControl() {
  const req = document.getElementById("ai-requirement").value.trim();
  const status = document.getElementById("draft-status");
  const result = document.getElementById("draft-result");
  const btn = document.getElementById("draft-btn");

  if (!req) { status.className = "status-line err"; status.innerText = "Describe the requirement first."; return; }

  btn.disabled = true; btn.textContent = "Thinking...";
  status.className = "status-line"; status.innerText = "The model is drafting a control. This can take up to a minute.";
  result.style.display = "none";

  try {
    const res = await apiFetch("/ai/draft-control", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ requirement: req })
    });
    const data = await res.json();

    if (data.status !== "DRAFT" || !data.draft) {
      status.className = "status-line err";
      status.innerText = data.error ? `Draft rejected: ${data.error}` : "Could not produce a valid draft.";
      btn.disabled = false; btn.textContent = "Generate Draft";
      return;
    }

    currentDraft = data;
    const d = data.draft;
    result.innerHTML = "";

    const head = document.createElement("div");
    head.className = "draft-badge";
    head.textContent = "DRAFT — not active until approved";
    result.appendChild(head);

    const grid = document.createElement("div");
    grid.className = "evidence-grid";
    [["Name", d.name], ["Description", d.description], ["Framework", d.framework],
     ["Severity", d.severity], ["Remediation", d.remediation],
     ["Condition", JSON.stringify(d.condition)],
     ["Model reasoning", d.reasoning || "—"]].forEach(([l, v]) => {
      const lab = document.createElement("div"); lab.className = "ev-label"; lab.textContent = l;
      const val = document.createElement("div"); val.className = "ev-value";
      if (l === "Condition") val.classList.add("ev-hash");
      val.textContent = v;
      grid.appendChild(lab); grid.appendChild(val);
    });
    result.appendChild(grid);

    const actions = document.createElement("div");
    actions.className = "ev-verify-row";
    const approve = document.createElement("button");
    approve.textContent = "Approve & Create Control";
    approve.onclick = approveDraft;
    const discard = document.createElement("button");
    discard.className = "action-btn"; discard.textContent = "Discard";
    discard.onclick = () => { result.style.display = "none"; currentDraft = null; status.innerText = ""; };
    actions.appendChild(approve); actions.appendChild(discard);
    result.appendChild(actions);

    const meta = document.createElement("div");
    meta.className = "ai-explain-meta";
    meta.style.marginTop = "10px";
    meta.textContent = `${data.model} · prompt ${data.prompt_version} · ${data.latency_ms}ms · interaction #${data.interaction_id}`;
    result.appendChild(meta);

    result.style.display = "block";
    status.className = "status-line ok"; status.innerText = "Draft ready for review.";
  } catch (e) {
    status.className = "status-line err"; status.innerText = "Failed to reach the AI service.";
  }
  btn.disabled = false; btn.textContent = "Generate Draft";
}

async function approveDraft() {
  if (!currentDraft) return;
  const d = currentDraft.draft;
  const status = document.getElementById("draft-status");
  const res = await apiFetch("/ai/approve-draft", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      name: d.name, description: d.description, framework: d.framework,
      severity: d.severity, remediation: d.remediation, condition: d.condition,
      interaction_id: currentDraft.interaction_id
    })
  });
  if (res.ok) {
    status.className = "status-line ok"; status.innerText = "Control approved and created.";
    document.getElementById("draft-result").style.display = "none";
    document.getElementById("ai-requirement").value = "";
    currentDraft = null;
    loadRules();
  } else {
    status.className = "status-line err"; status.innerText = "Failed to create the control.";
  }
}
loadRules();
</script>
</body>
</html>
