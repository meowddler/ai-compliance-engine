<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reports - Compliance Engine</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav-placeholder"></div>
<main>
  <h2>Reports</h2>
  <div class="panel" style="max-width:420px">
    <p style="color:var(--text-muted);font-size:14px;margin-top:0">Generate an audit-ready PDF summarizing compliance score, violations, and recent findings.</p>
    <button type="button" onclick="generateReport()">Generate Report</button>
    <p id="report-status" style="font-size:13px;color:var(--text-muted)"></p>
  </div>
  <div class="panel" id="preview-panel" style="display:none">
    <h2 style="margin-top:0">Preview</h2>
    <iframe id="report-frame" style="width:100%;height:600px;border:1px solid var(--border);border-radius:8px;background:white"></iframe>
    <button type="button" onclick="downloadReport()" style="margin-top:14px">⬇ Download PDF</button>
  </div>
</main>
<script src="js/auth.js"></script>
<script>
requireAuth();
renderNav("reports.html");
let currentReportBlob = null;

async function generateReport() {
  const status = document.getElementById("report-status");
  status.innerText = "Generating...";
  try {
    const res = await apiFetch("/reports/generate", { method: "POST" });
    if (!res.ok) {
      status.innerText = "Failed to generate report.";
      return;
    }
    const blob = await res.blob();
    const pdfBlob = blob.type === "application/pdf"
      ? blob
      : new Blob([blob], { type: "application/pdf" });

    const frame = document.getElementById("report-frame");
    if (frame.src) window.URL.revokeObjectURL(frame.src);

    currentReportBlob = pdfBlob;
    frame.src = window.URL.createObjectURL(pdfBlob);
    document.getElementById("preview-panel").style.display = "block";
    status.innerText = "Report ready — preview below.";
  } catch (err) {
    console.error("Report generation error:", err);
    status.innerText = "Something went wrong generating the report.";
  }
}

function downloadReport() {
  if (!currentReportBlob) return;
  const url = window.URL.createObjectURL(currentReportBlob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "compliance_report.pdf";
  a.click();
  window.URL.revokeObjectURL(url);
}
</script>
</body>
</html>
