<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scans - Compliance Engine</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav-placeholder"></div>
<main>
  <div class="page-head">
    <div>
      <h2 style="margin-bottom:4px">Scans</h2>
      <p class="page-sub">Upload infrastructure logs and review compliance findings.</p>
    </div>
  </div>

  <!-- Upload zone -->
  <div class="panel upload-zone" id="upload-zone">
    <div class="upload-inner">
      <div class="upload-icon">⬆</div>
      <div class="upload-text">
        <strong>Upload a log file</strong>
        <span>CSV format · drag &amp; drop or browse</span>
      </div>
      <input type="file" id="fileInput" accept=".csv" hidden>
      <div class="upload-actions">
        <button onclick="document.getElementById('fileInput').click()">Choose File</button>
        <button id="run-btn" onclick="uploadFile()">Run Scan</button>
      </div>
    </div>
    <div class="upload-footer">
      <span id="file-name" class="file-name">No file selected</span>
      <button class="action-btn danger" onclick="resetScans()">Clear Scan History</button>
    </div>
    <p id="upload-status" class="status-line"></p>
  </div>

  <!-- Scan history -->
  <div class="panel">
    <div class="panel-head">
      <h2>Scan History</h2>
      <span class="hint">click a row for details</span>
    </div>
    <input type="text" id="scan-search" placeholder="Search by filename..." oninput="filterScans()">
    <table>
      <thead><tr><th>ID</th><th>Filename</th><th>Rows</th><th>Time</th></tr></thead>
      <tbody id="scans-body"></tbody>
    </table>
  </div>

  <!-- Evidence panel (shown with scan detail) -->
  <div class="panel evidence-panel" id="evidence-panel" style="display:none">
    <div class="panel-head">
      <h2>Evidence</h2>
      <span class="hint">tamper-evident source record</span>
    </div>
    <div class="evidence-grid" id="evidence-grid"></div>
  </div>

  <!-- Findings detail -->
  <div class="panel" id="scan-detail-panel" style="display:none">
    <div class="panel-head">
      <h2 id="scan-detail-title">Findings</h2>
    </div>
    <div class="status-summary" id="status-summary"></div>
    <table>
      <thead><tr><th>Server</th><th>Rule</th><th>Status</th><th>Severity</th><th>Anomaly</th><th>AI</th></tr></thead>
      <tbody id="scan-detail-body"></tbody>
    </table>
  </div>
</main>

<script src="js/auth.js"></script>
<script>
requireAuth();
renderNav("scans.html");

let allScans = [];
let allViolations = [];

function textCell(value, className) {
  const td = document.createElement("td");
  td.textContent = value ?? "";
  if (className) td.className = className;
  return td;
}

function pillCell(value) {
  const td = document.createElement("td");
  const span = document.createElement("span");
  span.className = "pill " + (value || "").toLowerCase().replace(/_/g, "-");
  span.textContent = (value || "").replace(/_/g, " ");
  td.appendChild(span);
  return td;
}

async function loadScans() {
  const res = await apiFetch("/scans");
  allScans = await res.json();
  renderScans(allScans);
  const vRes = await apiFetch("/violations");
  allViolations = await vRes.json();
}

function renderScans(list) {
  const tbody = document.getElementById("scans-body");
  tbody.innerHTML = "";
  if (list.length === 0) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 4; td.className = "empty-state";
    td.textContent = "No scans yet — upload a CSV above.";
    tr.appendChild(td); tbody.appendChild(tr);
    return;
  }
  list.slice().reverse().forEach((s, i) => {
    const row = document.createElement("tr");
    row.style.cursor = "pointer";
    row.style.animationDelay = (i * 0.03) + "s";
    row.className = "row-in";
    row.appendChild(textCell("#" + s.id));
    row.appendChild(textCell(s.filename));
    row.appendChild(textCell(s.rows_scanned));
    row.appendChild(textCell(new Date(s.created_at).toLocaleString()));
    row.onclick = () => showScanDetail(s);
    tbody.appendChild(row);
  });
}

function filterScans() {
  const q = document.getElementById("scan-search").value.toLowerCase();
  renderScans(allScans.filter(s => (s.filename || "").toLowerCase().includes(q)));
}

async function loadEvidence(scanId) {
  const panel = document.getElementById("evidence-panel");
  const grid = document.getElementById("evidence-grid");
  grid.innerHTML = "";
  let ev = null;
  try {
    const res = await apiFetch(`/scans/${scanId}/evidence`);
    if (res.ok) ev = await res.json();
  } catch {}
  if (!ev) { panel.style.display = "none"; return; }

  const fresh = ev.freshness || {};
  const freshText = fresh.state === "FRESH"
    ? `Fresh — ${fresh.age_days}d old (limit ${fresh.threshold_days}d)`
    : fresh.state === "STALE"
      ? `Stale — ${fresh.age_days}d old, exceeds ${fresh.threshold_days}d`
      : "Unknown";

  const rows = [
    ["File", ev.filename],
    ["SHA-256", ev.sha256],
    ["Size", ev.size_bytes + " bytes"],
    ["Uploaded by", ev.uploaded_by],
    ["Collected", ev.collected_at ? new Date(ev.collected_at).toLocaleString() : "—"],
    ["Freshness", freshText],
  ]
  rows.forEach(([label, value]) => {
    const l = document.createElement("div"); l.className = "ev-label"; l.textContent = label;
    const v = document.createElement("div"); v.className = "ev-value";
    if (label === "SHA-256") v.classList.add("ev-hash");
    v.textContent = value;
    grid.appendChild(l); grid.appendChild(v);
  });

  // verify button + result
  const spacer = document.createElement("div");
  const actions = document.createElement("div");
  actions.className = "ev-verify-row";
  const btn = document.createElement("button");
  btn.className = "action-btn"; btn.textContent = "Verify Integrity";
  const result = document.createElement("span");
  result.className = "ev-verify-result";
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = "Verifying...";
    result.textContent = "";
    try {
      const res = await apiFetch(`/evidence/${ev.id}/verify`);
      const data = await res.json();
      result.className = "ev-verify-result " + (data.status === "INTACT" ? "ok" : "bad");
      result.innerHTML = (data.status === "INTACT"
        ? '<span class="dot green"></span>INTACT — hash matches'
        : '<span class="dot red"></span>' + data.status + ' — hash mismatch');
    } catch {
      result.className = "ev-verify-result bad"; result.textContent = "Verify failed.";
    }
    btn.disabled = false; btn.textContent = "Verify Integrity";
  };
  actions.appendChild(btn); actions.appendChild(result);
  grid.appendChild(spacer); grid.appendChild(actions);

  panel.style.display = "block";
}

function showScanDetail(scan) {
  const panel = document.getElementById("scan-detail-panel");
  document.getElementById("scan-detail-title").innerText = `Scan #${scan.id} — ${scan.filename}`;
  const tbody = document.getElementById("scan-detail-body");
  const findings = allViolations.filter(v => v.scan_id === scan.id);

  loadEvidence(scan.id);   // NEW — surface the evidence record for this scan

  const counts = {};
  findings.forEach(v => { const s = v.status || "FAIL"; counts[s] = (counts[s] || 0) + 1; });
  const summary = document.getElementById("status-summary");
  summary.innerHTML = "";
  Object.entries(counts).forEach(([status, n]) => {
    const chip = document.createElement("span");
    chip.className = "summary-chip " + status.toLowerCase().replace(/_/g, "-");
    chip.textContent = `${status.replace(/_/g, " ")}: ${n}`;
    summary.appendChild(chip);
  });

  tbody.innerHTML = "";
  if (findings.length === 0) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 6; td.className = "empty-state";
    td.textContent = "No findings — clean scan!";
    tr.appendChild(td); tbody.appendChild(tr);
  } else {
    findings.forEach((v, i) => {
      const row = document.createElement("tr");
      row.style.animationDelay = (i * 0.02) + "s";
      row.className = "row-in";
      row.appendChild(textCell(v.server_id));
      row.appendChild(textCell(v.rule_name));
      row.appendChild(pillCell(v.status || "FAIL"));
      row.appendChild(textCell(v.severity, v.severity));
      const anomalyTd = document.createElement("td");
      if (v.is_anomaly) { anomalyTd.innerHTML = '<span class="dot amber"></span>Yes'; }
      else { anomalyTd.textContent = "No"; }
      row.appendChild(anomalyTd);

      // AI explanation — the engine's verdict is already set; this only explains it.
      const aiTd = document.createElement("td");
      const aiBtn = document.createElement("button");
      aiBtn.className = "action-btn";
      aiBtn.textContent = "Explain";
      aiBtn.onclick = (e) => { e.stopPropagation(); explainFinding(v.id, row, aiBtn); };
      aiTd.appendChild(aiBtn);
      row.appendChild(aiTd);

      tbody.appendChild(row);
    });
  }
  panel.style.display = "block";
  document.getElementById("evidence-panel").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
async function explainFinding(violationId, row, btn) {
  btn.disabled = true;
  btn.textContent = "Thinking...";

  // Remove any previous explanation row for this finding
  const existing = row.nextElementSibling;
  if (existing && existing.classList.contains("ai-explain-row")) existing.remove();

  const exRow = document.createElement("tr");
  exRow.className = "ai-explain-row";
  const exTd = document.createElement("td");
  exTd.colSpan = 6;
  exTd.className = "ai-explain-cell";
  exTd.textContent = "Generating explanation...";
  exRow.appendChild(exTd);
  row.after(exRow);

  try {
    const res = await apiFetch(`/violations/${violationId}/explain`, { method: "POST" });
    const data = await res.json();
    exTd.innerHTML = "";

    const header = document.createElement("div");
    header.className = "ai-explain-head";
    header.textContent = "NEMOR Analyst";
    exTd.appendChild(header);

    const body = document.createElement("div");
    body.className = "ai-explain-body";
    body.textContent = data.explanation || data.error || "No explanation returned.";
    exTd.appendChild(body);

    const meta = document.createElement("div");
    meta.className = "ai-explain-meta";
    meta.textContent = `${data.model || "—"} · prompt ${data.prompt_version || "—"} · ${data.latency_ms || 0}ms · status ${data.authoritative_status} assigned by the deterministic engine`;
    exTd.appendChild(meta);
  } catch (err) {
    exTd.textContent = "Failed to generate explanation.";
  }
  btn.disabled = false;
  btn.textContent = "Explain";
}

document.getElementById("fileInput").addEventListener("change", (e) => {
  const name = e.target.files.length ? e.target.files[0].name : "No file selected";
  document.getElementById("file-name").textContent = name;
});

const zone = document.getElementById("upload-zone");
["dragover", "dragenter"].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add("drag"); }));
["dragleave", "drop"].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove("drag"); }));
zone.addEventListener("drop", e => {
  if (e.dataTransfer.files.length) {
    document.getElementById("fileInput").files = e.dataTransfer.files;
    document.getElementById("file-name").textContent = e.dataTransfer.files[0].name;
  }
});

async function uploadFile() {
  const fileInput = document.getElementById("fileInput");
  const status = document.getElementById("upload-status");
  if (!fileInput.files.length) { status.className = "status-line err"; status.innerText = "Choose a CSV file first."; return; }
  const formData = new FormData();
  formData.append("file", fileInput.files[0]);
  status.className = "status-line"; status.innerText = "Scanning...";
  const res = await apiFetch("/upload-logs", { method: "POST", body: formData });
  if (res.ok) {
    const data = await res.json();
    status.className = "status-line ok";
    status.innerText = `Scan complete — ${data.rows_scanned} rows scanned.`;
    loadScans();
  } else { status.className = "status-line err"; status.innerText = "Scan failed."; }
}

async function resetScans() {
  if (!confirm("This deletes ALL scans and violations permanently. Continue?")) return;
  const res = await apiFetch("/scans/reset", { method: "DELETE" });
  const status = document.getElementById("upload-status");
  if (res.ok) {
    status.className = "status-line ok";
    status.innerText = "Scan history cleared.";
    document.getElementById("scan-detail-panel").style.display = "none";
    document.getElementById("evidence-panel").style.display = "none";
    loadScans();
  } else if (res.status === 403) { status.className = "status-line err"; status.innerText = "Not authorized — Admin only."; }
  else { status.className = "status-line err"; status.innerText = "Failed to reset."; }
}
loadScans();
</script>
</body>
</html>
