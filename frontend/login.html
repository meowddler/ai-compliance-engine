<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Compliance Engine</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-wrap">
  <h1>Compliance Engine</h1>
  <input type="text" id="username" placeholder="Username" value="admin">
  <input type="password" id="password" placeholder="Password" value="admin123">
  <button onclick="login()" style="width:100%">Log In</button>
  <p class="error" id="error-msg"></p>
</div>

<script src="js/auth.js"></script>
<script>
async function login() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  const formBody = new URLSearchParams();
  formBody.append("username", username);
  formBody.append("password", password);

  const res = await fetch(`${API_BASE}/auth/login`, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: formBody
  });
  const data = await res.json();

  if (data.access_token) {
    saveSession(data.access_token, username, data.role || "");
    // role isn't in the login response yet — we'll fix that below
    window.location.href = "dashboard.html";
  } else {
    document.getElementById("error-msg").innerText = "Login failed — check credentials.";
  }
}
</script>
</body>
</html>
