<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audit Log - Compliance Engine</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav-placeholder"></div>
<main>
  <div class="page-head">
    <div>
      <h2 style="margin-bottom:4px">Audit Log</h2>
      <p class="page-sub">Append-only record of every state-changing action. Tamper-evident by design.</p>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>Activity</h2>
      <span class="hint" id="audit-count"></span>
    </div>
    <input type="text" id="audit-search" placeholder="Search by user or action..." oninput="filterAudit()">
    <table>
      <thead><tr><th>User</th><th>Action</th><th>Details</th><th>Time</th></tr></thead>
      <tbody id="audit-body"></tbody>
    </table>
  </div>
</main>

<script src="js/auth.js"></script>
<script>
if (!requireAuth()) throw new Error("Not authenticated");
renderNav("audit.html");
let allAudit = [];

// action -> pill class (color-codes the kind of action)
function actionClass(action) {
  const a = (action || "").toLowerCase();
  if (a.includes("delete")) return "fail";
  if (a.includes("updat")) return "error";
  if (a.includes("creat")) return "pass";
  return "insufficient-evidence";
}

// Render a single full-width message row. Used for empty and error states so
// a failure is visible rather than leaving a silently blank table.
function messageRow(tbody, text, cols) {
  tbody.innerHTML = "";
  const tr = document.createElement("tr");
  const td = document.createElement("td");
  td.colSpan = cols; td.className = "empty-state";
  td.textContent = text;
  tr.appendChild(td); tbody.appendChild(tr);
}

async function loadAudit() {
  const tbody = document.getElementById("audit-body");
  let res;
  try {
    // apiFetch throws on an expired session or a timeout. Without this the
    // page would fail with an unhandled rejection and render nothing at all.
    res = await apiFetch("/audit-log");
  } catch (err) {
    messageRow(tbody, "Could not load the audit log: " + err.message, 4);
    return;
  }

  if (res.status === 403) {
    tbody.innerHTML = "";
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 4; td.className = "empty-state";
    td.textContent = "You don't have permission to view this.";
    tr.appendChild(td); tbody.appendChild(tr);
    document.getElementById("audit-search").style.display = "none";
    return;
  }
  if (!res.ok) {
    messageRow(tbody, `Could not load the audit log (HTTP ${res.status}).`, 4);
    return;
  }

  try {
    allAudit = await res.json();
  } catch {
    messageRow(tbody, "The server returned an unreadable response.", 4);
    return;
  }
  renderAudit(allAudit);
}

function renderAudit(list) {
  const tbody = document.getElementById("audit-body");
  document.getElementById("audit-count").textContent = `${list.length} event${list.length === 1 ? "" : "s"}`;
  if (list.length === 0) { tbody.innerHTML = `<tr><td colspan="4" class="empty-state">No audit activity yet.</td></tr>`; return; }
  tbody.innerHTML = "";
  list.forEach((e, i) => {
    const row = document.createElement("tr");
    row.className = "row-in";
    row.style.animationDelay = (i * 0.02) + "s";

    // user
    const userTd = document.createElement("td");
    userTd.textContent = e.username; userTd.style.fontWeight = "600";

    // action pill (textContent — no HTML injection)
    const actionTd = document.createElement("td");
    const pill = document.createElement("span");
    pill.className = "pill " + actionClass(e.action);
    pill.textContent = (e.action || "").replace(/_/g, " ");
    actionTd.appendChild(pill);

    // details — textContent, closes the stored-XSS hole this page used to have
    const detailsTd = document.createElement("td");
    detailsTd.textContent = e.details;
    detailsTd.style.color = "var(--text-muted)";
    detailsTd.style.fontSize = "12.5px";

    // time — mono
    const timeTd = document.createElement("td");
    // Timestamps are stored in UTC; render them in the viewer's local time.
    // Timestamps now carry their own UTC offset, so no suffix is needed.
    timeTd.textContent = new Date(e.timestamp).toLocaleString();
    timeTd.className = "mono-cell";

    row.append(userTd, actionTd, detailsTd, timeTd);
    tbody.appendChild(row);
  });
}

function filterAudit() {
  const q = document.getElementById("audit-search").value.toLowerCase();
  renderAudit(allAudit.filter(a => a.username.toLowerCase().includes(q) || a.action.toLowerCase().includes(q)));
}
loadAudit();
</script>
</body>
</html>
